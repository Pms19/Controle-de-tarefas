name: Patch micro actions

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          if [[ "${{ github.event.head_commit.message }}" == Automated\ micro\ actions\ patch* ]]; then exit 0; fi
          python3 patch_micro.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Automated micro actions patch [skip ci]'
          git push

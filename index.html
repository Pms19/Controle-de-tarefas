<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Tarefas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a18;min-height:100vh}.app{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}.header{margin-bottom:1.75rem}.header h1{font-size:22px;font-weight:500;margin-bottom:4px}.header p{font-size:14px;color:#6b6b68}.toolbar{display:flex;gap:10px;margin-bottom:1.5rem;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px;font-size:14px;height:36px;padding:0 12px;border:.5px solid #c8c8c4;border-radius:8px;background:#fff;outline:none}.btn-primary{display:flex;align-items:center;gap:6px;padding:0 14px;height:36px;font-size:14px;font-weight:500;cursor:pointer;background:#1a1a18;color:#fff;border:0;border-radius:8px}.table-wrap{border:.5px solid #e0deda;border-radius:12px;overflow:hidden;background:#fff}table{width:100%;border-collapse:collapse}th{font-size:11px;font-weight:500;color:#6b6b68;padding:9px 12px;text-align:left;border-bottom:.5px solid #e0deda;text-transform:uppercase}td{font-size:13px;padding:10px 12px;border-bottom:.5px solid #e0deda}.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px}.b-p{background:#FAEEDA;color:#854F0B}.b-a{background:#E6F1FB;color:#185FA5}.b-c{background:#EAF3DE;color:#3B6D11}.status{font-size:12px;color:#3B6D11;background:#EAF3DE;padding:7px 10px;border-radius:20px;display:inline-block}
</style></head>
<body><div class="app">
<div class="header"><h1>Controle de tarefas</h1><p>Acompanhamento mensal · sincronização automática</p></div>
<div class="toolbar"><input id="busca" placeholder="Buscar por atividade ou responsável…"><button class="btn-primary" id="novo"><i class="ti ti-plus"></i> Nova tarefa</button></div>
<div class="table-wrap"><table><thead><tr><th>Assunto</th><th>Atividade</th><th>Responsável</th><th>Onde parou</th><th>Status</th></tr></thead><tbody id="lista"><tr><td colspan="5">Carregando…</td></tr></tbody></table></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://fcvemrvdivwcpwybcjvv.supabase.co', KEY='sb_publishable_ZzUOm6wCN1sr34E24Y_g9g_VTRhU1jJ', db=supabase.createClient(URL,KEY);
let tarefas=[];
function bc(s){return s==='Pendente'?'b-p':s==='Aguardando'?'b-a':s==='Concluído'?'b-c':''}
async function carregar(){const {data,error}=await db.from('tarefas').select('*').order('id');if(error){document.getElementById('lista').innerHTML='<tr><td colspan="5">Erro ao conectar ao banco.</td></tr>';return}tarefas=data||[];render()}
function render(){const q=document.getElementById('busca').value.toLowerCase();const l=tarefas.filter(t=>(t.atividade||'').toLowerCase().includes(q)||(t.responsavel||'').toLowerCase().includes(q));document.getElementById('lista').innerHTML=l.length?l.map(t=>'<tr><td>'+ (t.assunto||'—')+'</td><td>'+t.atividade+'</td><td>'+ (t.responsavel||'—')+'</td><td>'+ (t.onde||'—')+'</td><td><span class="badge '+bc(t.status)+'">'+(t.status||'—')+'</span></td></tr>').join(''):'<tr><td colspan="5">Nenhuma tarefa encontrada.</td></tr>'}
document.getElementById('busca').oninput=render;
db.channel('tarefas-sync').on('postgres_changes',{event:'*',schema:'public',table:'tarefas'},carregar).subscribe();
carregar();
</script></body></html>
